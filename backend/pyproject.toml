[project]
name = "revisionproof"
version = "0.1.0"
description = "Deterministic approval firewall for video revisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.2.0,<3",
  "opencv-python-headless>=4.11.0,<5",
  "httpx>=0.28.0,<1",
  "pillow>=11.3,<13",
]

[project.optional-dependencies]
live = [
  "google-adk>=1.9.0,<2",
  "google-genai>=1.28.0,<2",
  "google-cloud-storage>=3.2.0,<4",
  "clickhouse-connect>=0.8.18,<1",
  "mcp>=1.12.0,<2",
  "mcp-clickhouse>=0.1.10,<1",
]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.0,<7",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisionproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
