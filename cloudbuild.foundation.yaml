substitutions:
  _REGION: us-central1
  _SERVICE: revisionproof-staging
  _REPOSITORY: revisionproof
  _GCS_BUCKET: ${PROJECT_ID}-media
  _MIN_INSTANCES: "1"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - REVISIONPROOF_INSTALL_LIVE=false
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
  - id: deploy-foundation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=revisionproof-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --labels=app=revisionproof,environment=hackathon,managed-by=revisionproof-gcp,phase=foundation
      - --memory=4Gi
      - --cpu=2
      - --concurrency=8
      - --max-instances=1
      - --min-instances=${_MIN_INSTANCES}
      - --timeout=300
      - --set-env-vars=REVISIONPROOF_MODE=FIXTURE,REVISIONPROOF_GOOGLE_CLOUD_PROJECT=${PROJECT_ID},REVISIONPROOF_GOOGLE_CLOUD_LOCATION=${_REGION},REVISIONPROOF_GCS_BUCKET=${_GCS_BUCKET}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/revisionproof-build@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
