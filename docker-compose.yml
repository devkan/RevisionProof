services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: revisionproof
      CLICKHOUSE_USER: revisionproof
      CLICKHOUSE_PASSWORD: revisionproof-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/clickhouse/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./infra/clickhouse/intelligence.sql:/docker-entrypoint-initdb.d/03-intelligence.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
